<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="pcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0b10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pcCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2438"/>
      <stop offset="50%" stop-color="#0f1322"/>
      <stop offset="100%" stop-color="#080a12"/>
    </linearGradient>
    <linearGradient id="rgbFan1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="rgbFan2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="pcNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <circle cx="300" cy="300" r="260" fill="url(#pcGlow)"/>
  <ellipse cx="300" cy="520" rx="200" ry="20" fill="#000" opacity="0.6"/>

  <g transform="translate(0, -10)">
    <!-- Tower Main Chassis -->
    <rect x="180" y="100" width="240" height="390" rx="20" fill="url(#pcCase)" stroke="#384366" stroke-width="3"/>

    <!-- Tempered Glass Side Window -->
    <rect x="195" y="120" width="165" height="345" rx="12" fill="#080c18" stroke="#1f2740" stroke-width="2" fill-opacity="0.85"/>

    <!-- Motherboard & Internal Hardware -->
    <g transform="translate(205, 130)">
      <!-- Liquid Cooler CPU Block with Infinity Mirror -->
      <circle cx="65" cy="80" r="28" fill="#0c1020" stroke="#06b6d4" stroke-width="2" filter="url(#pcNeon)"/>
      <circle cx="65" cy="80" r="18" fill="none" stroke="#a855f7" stroke-width="2" filter="url(#pcNeon)"/>
      <circle cx="65" cy="80" r="8" fill="#06b6d4"/>
      <!-- Liquid Cooling Braided Tubes -->
      <path d="M 65 60 C 65 20, 120 20, 130 50" fill="none" stroke="#06b6d4" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
      <path d="M 75 60 C 85 30, 130 30, 135 70" fill="none" stroke="#a855f7" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

      <!-- RAM Sticks with ARGB Diffusion -->
      <rect x="105" y="60" width="6" height="40" rx="2" fill="#ec4899" filter="url(#pcNeon)"/>
      <rect x="114" y="60" width="6" height="40" rx="2" fill="#06b6d4" filter="url(#pcNeon)"/>
      <rect x="123" y="60" width="6" height="40" rx="2" fill="#a855f7" filter="url(#pcNeon)"/>
      <rect x="132" y="60" width="6" height="40" rx="2" fill="#3b82f6" filter="url(#pcNeon)"/>

      <!-- RTX Graphics Card with RGB Underglow -->
      <rect x="10" y="160" width="135" height="45" rx="6" fill="#14192b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="45" cy="182" r="14" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
      <circle cx="95" cy="182" r="14" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
      <line x1="15" y1="202" x2="140" y2="202" stroke="#ec4899" stroke-width="3" filter="url(#pcNeon)"/>

      <!-- PSU Shroud Cover -->
      <rect x="0" y="270" width="145" height="55" rx="6" fill="#111626" stroke="#232c45" stroke-width="1"/>
      <text x="72" y="303" fill="#06b6d4" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle" letter-spacing="2">1200W PLATINUM</text>
    </g>

    <!-- Front Panel ARGB Intake Fans -->
    <g transform="translate(370, 140)">
      <!-- Top Fan -->
      <circle cx="18" cy="40" r="26" fill="#0f1322" stroke="#334155" stroke-width="2"/>
      <circle cx="18" cy="40" r="22" fill="url(#rgbFan1)" opacity="0.8" filter="url(#pcNeon)"/>
      <circle cx="18" cy="40" r="8" fill="#1e293b"/>

      <!-- Middle Fan -->
      <circle cx="18" cy="120" r="26" fill="#0f1322" stroke="#334155" stroke-width="2"/>
      <circle cx="18" cy="120" r="22" fill="url(#rgbFan2)" opacity="0.8" filter="url(#pcNeon)"/>
      <circle cx="18" cy="120" r="8" fill="#1e293b"/>

      <!-- Bottom Fan -->
      <circle cx="18" cy="200" r="26" fill="#0f1322" stroke="#334155" stroke-width="2"/>
      <circle cx="18" cy="200" r="22" fill="url(#rgbFan1)" opacity="0.8" filter="url(#pcNeon)"/>
      <circle cx="18" cy="200" r="8" fill="#1e293b"/>
    </g>

    <!-- Top Power Button & Front I/O -->
    <circle cx="390" cy="115" r="5" fill="#06b6d4" filter="url(#pcNeon)"/>
    <rect x="375" y="112" width="6" height="6" rx="1" fill="#334155"/>
    <rect x="365" y="112" width="6" height="6" rx="1" fill="#334155"/>

    <!-- Glass Reflection -->
    <polygon points="195,120 280,120 215,465 195,465" fill="#ffffff" opacity="0.04"/>
  </g>
</svg>
