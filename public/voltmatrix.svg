<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="voltGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0b10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyberCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2436"/>
      <stop offset="50%" stop-color="#0f1320"/>
      <stop offset="100%" stop-color="#080a12"/>
    </linearGradient>
    <linearGradient id="circuitGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="amberGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Power Glow -->
  <circle cx="300" cy="300" r="260" fill="url(#voltGlow)"/>

  <!-- Shadow -->
  <ellipse cx="300" cy="510" rx="190" ry="20" fill="#000" opacity="0.6"/>

  <!-- Power Station Chassis (Isometric / Front-Facing View) -->
  <g transform="translate(0, 10)">
    <!-- Main Enclosure -->
    <rect x="160" y="140" width="280" height="340" rx="24" fill="url(#cyberCase)" stroke="#384364" stroke-width="3"/>

    <!-- Transparent Clear Cyberpunk Window Panel -->
    <rect x="180" y="160" width="240" height="200" rx="16" fill="#0a0d18" stroke="#10b981" stroke-width="1.5" fill-opacity="0.8"/>

    <!-- Visible Internal GaN Heat Sinks & Gold Capacitors -->
    <g transform="translate(190, 170)">
      <!-- Circuit Board Traces -->
      <path d="M 10 30 H 60 V 80 H 120" stroke="url(#circuitGold)" stroke-width="2" fill="none" opacity="0.8"/>
      <path d="M 210 30 H 160 V 80 H 120" stroke="url(#circuitGold)" stroke-width="2" fill="none" opacity="0.8"/>
      <circle cx="120" cy="80" r="6" fill="#f59e0b" filter="url(#amberGlow)"/>

      <!-- Solid-State Capacitors -->
      <rect x="20" y="50" width="30" height="40" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="60" y="50" width="30" height="40" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      
      <!-- GaN Transformer Core Coil -->
      <rect x="140" y="45" width="60" height="50" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
      <text x="170" y="75" fill="#38bdf8" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">GaN III</text>
    </g>

    <!-- Real-Time IPS Telemetry Status Display -->
    <rect x="195" y="270" width="210" height="75" rx="8" fill="#05070e" stroke="#2a3550" stroke-width="1.5"/>
    
    <!-- Display Readouts -->
    <text x="210" y="295" fill="#10b981" font-size="18" font-weight="bold" font-family="'Courier New', monospace" filter="url(#amberGlow)">238.4W</text>
    <text x="285" y="295" fill="#94a3b8" font-size="10" font-family="sans-serif">MAX OUTPUT</text>
    
    <line x1="205" y1="305" x2="395" y2="305" stroke="#1f293d" stroke-width="1"/>
    
    <text x="210" y="325" fill="#38bdf8" font-size="11" font-family="'Courier New', monospace">C1: 140W (PD 3.1)</text>
    <text x="210" y="338" fill="#f59e0b" font-size="11" font-family="'Courier New', monospace">C2: 65W | C3: 33W</text>
    <text x="365" y="330" fill="#10b981" font-size="14" font-family="sans-serif">⚡ 99%</text>

    <!-- Lower Port Deck (USB-C & USB-A Fast Charging Outlets) -->
    <g transform="translate(195, 380)">
      <!-- USB-C Port 1 (140W) -->
      <rect x="10" y="10" width="36" height="14" rx="4" fill="#090c16" stroke="#f59e0b" stroke-width="2"/>
      <rect x="16" y="15" width="24" height="4" rx="1" fill="#f59e0b"/>
      <text x="28" y="38" fill="#94a3b8" font-size="8" font-weight="bold" text-anchor="middle" font-family="sans-serif">140W</text>

      <!-- USB-C Port 2 (100W) -->
      <rect x="62" y="10" width="36" height="14" rx="4" fill="#090c16" stroke="#06b6d4" stroke-width="2"/>
      <rect x="68" y="15" width="24" height="4" rx="1" fill="#06b6d4"/>
      <text x="80" y="38" fill="#94a3b8" font-size="8" font-weight="bold" text-anchor="middle" font-family="sans-serif">100W</text>

      <!-- USB-C Port 3 (65W) -->
      <rect x="114" y="10" width="36" height="14" rx="4" fill="#090c16" stroke="#a855f7" stroke-width="2"/>
      <rect x="120" y="15" width="24" height="4" rx="1" fill="#a855f7"/>
      <text x="132" y="38" fill="#94a3b8" font-size="8" font-weight="bold" text-anchor="middle" font-family="sans-serif">65W</text>

      <!-- USB-A Port (22.5W) -->
      <rect x="165" y="8" width="36" height="18" rx="3" fill="#090c16" stroke="#64748b" stroke-width="1.5"/>
      <rect x="171" y="13" width="24" height="8" rx="1" fill="#1e293b"/>
      <text x="183" y="38" fill="#94a3b8" font-size="8" font-weight="bold" text-anchor="middle" font-family="sans-serif">USB-A</text>
    </g>

    <!-- Glass Reflection Streak -->
    <polygon points="180,160 260,160 220,360 180,360" fill="#ffffff" opacity="0.04"/>
  </g>
</svg>
