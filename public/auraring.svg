<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0b10" stop-opacity="0"/>
    </radialGradient>
    <!-- Titanium Outer Surface Gradient -->
    <linearGradient id="titaniumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="30%" stop-color="#64748b"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="75%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <!-- Inner Sensor Lining -->
    <linearGradient id="innerLining" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#151c2d"/>
    </linearGradient>
    <filter id="sensorGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="300" cy="300" r="260" fill="url(#ringGlow)"/>

  <!-- Ring Drop Shadow -->
  <ellipse cx="300" cy="480" rx="180" ry="24" fill="#000" opacity="0.6"/>

  <!-- 3D Perspective Smart Ring -->
  <g transform="translate(300, 280) rotate(-15)">
    <!-- Back Rim & Inner Cylinder Surface -->
    <ellipse cx="0" cy="-20" rx="150" ry="110" fill="url(#innerLining)" stroke="#334155" stroke-width="3"/>

    <!-- PPG Optical Biometric Sensors on Inner Surface -->
    <g transform="translate(0, -20)">
      <!-- Green Optical Heart Rate LED -->
      <circle cx="-50" cy="40" r="8" fill="#10b981" filter="url(#sensorGlow)"/>
      <circle cx="-50" cy="40" r="4" fill="#ffffff"/>
      
      <!-- Red Infrared SpO2 Sensor LED -->
      <circle cx="0" cy="50" r="8" fill="#ef4444" filter="url(#sensorGlow)"/>
      <circle cx="0" cy="50" r="4" fill="#ffffff"/>
      
      <!-- Gold Temperature Sensor Contact -->
      <rect x="40" y="32" width="14" height="14" rx="3" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
    </g>

    <!-- Ring Thickness Wall / Hollow Interior -->
    <ellipse cx="0" cy="0" rx="120" ry="85" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>

    <!-- Front Curved Titanium Band Body -->
    <path d="M -150 -20 
             C -150 70, -80 130, 0 130 
             C 80 130, 150 70, 150 -20 
             C 150 20, 100 80, 0 80 
             C -100 80, -150 20, -150 -20 Z" 
          fill="url(#titaniumGrad)" stroke="#64748b" stroke-width="1.5"/>

    <!-- Outer Titanium Polished Highlight Specular -->
    <path d="M -145 0 
             C -130 55, -70 100, 0 100 
             C 70 100, 130 55, 145 0" 
          fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6" stroke-linecap="round"/>

    <!-- Subtle Circuit Trace Inlay -->
    <path d="M -90 45 C -40 85, 40 85, 90 45" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="8 6" opacity="0.8" filter="url(#sensorGlow)"/>

    <!-- Micro LED Indicator Dot -->
    <circle cx="0" cy="95" r="3.5" fill="#38bdf8" filter="url(#sensorGlow)"/>
  </g>

  <!-- Clean Floating Metric Indicators -->
  <g transform="translate(180, 140)">
    <rect x="0" y="0" width="100" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.9"/>
    <text x="50" y="20" fill="#10b981" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">HR 62 BPM</text>
  </g>
  <g transform="translate(340, 140)">
    <rect x="0" y="0" width="100" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.9"/>
    <text x="50" y="20" fill="#a855f7" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">SLEEP 94%</text>
  </g>
</svg>
