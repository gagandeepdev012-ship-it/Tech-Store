<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="budsGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0b10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="caseWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="caseDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2438"/>
      <stop offset="100%" stop-color="#0b0e18"/>
    </linearGradient>
    <filter id="budsNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <circle cx="300" cy="300" r="260" fill="url(#budsGlow)"/>
  <ellipse cx="300" cy="510" rx="190" ry="20" fill="#000" opacity="0.6"/>

  <g transform="translate(0, 10)">
    <!-- Wireless Charging Case (Open Lid View) -->
    <g transform="translate(190, 200)">
      <!-- Lower Case Body -->
      <path d="M 10 70 C 10 150, 210 150, 210 70 L 210 50 L 10 50 Z" fill="url(#caseWhite)" stroke="#cbd5e1" stroke-width="2"/>
      
      <!-- Inner Earbud Wells -->
      <ellipse cx="65" cy="50" rx="35" ry="20" fill="url(#caseDark)"/>
      <ellipse cx="155" cy="50" rx="35" ry="20" fill="url(#caseDark)"/>
      
      <!-- Front LED Battery Status Dot -->
      <circle cx="110" cy="95" r="4" fill="#10b981" filter="url(#budsNeon)"/>

      <!-- Charging Case Open Lid (Back Flap) -->
      <path d="M 10 50 C 10 -20, 210 -20, 210 50 Z" fill="url(#caseWhite)" stroke="#cbd5e1" stroke-width="2" opacity="0.9"/>
    </g>

    <!-- Left Floating Earbud (Left Angle) -->
    <g transform="translate(120, 100) rotate(-15)">
      <!-- Earbud Head Capsule -->
      <ellipse cx="40" cy="40" rx="26" ry="22" fill="url(#caseWhite)" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Soft Silicone Ear Tip -->
      <ellipse cx="20" cy="40" rx="14" ry="18" fill="#38bdf8" opacity="0.85" filter="url(#budsNeon)"/>
      <!-- Stem with Touch Bar -->
      <rect x="34" y="48" width="14" height="65" rx="7" fill="url(#caseWhite)" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Touch Sensor Groove -->
      <line x1="41" y1="65" x2="41" y2="85" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
      <!-- Dual ANC Microphones -->
      <circle cx="41" cy="28" r="2.5" fill="#0f172a"/>
      <circle cx="41" cy="105" r="2.5" fill="#0f172a"/>
    </g>

    <!-- Right Floating Earbud (Right Angle) -->
    <g transform="translate(380, 100) rotate(15)">
      <ellipse cx="40" cy="40" rx="26" ry="22" fill="url(#caseWhite)" stroke="#cbd5e1" stroke-width="1.5"/>
      <ellipse cx="60" cy="40" rx="14" ry="18" fill="#38bdf8" opacity="0.85" filter="url(#budsNeon)"/>
      <rect x="32" y="48" width="14" height="65" rx="7" fill="url(#caseWhite)" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="39" y1="65" x2="39" y2="85" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
      <circle cx="39" cy="28" r="2.5" fill="#0f172a"/>
      <circle cx="39" cy="105" r="2.5" fill="#0f172a"/>
    </g>

    <!-- Brand Emblem -->
    <text x="300" y="480" fill="#64748b" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle" letter-spacing="2">NEXUS AEROPODS PRO • ACTIVE ANC</text>
  </g>
</svg>
