<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="heatGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a0b10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="towerBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2436"/>
      <stop offset="60%" stop-color="#0f1322"/>
      <stop offset="100%" stop-color="#090c16"/>
    </linearGradient>
    <linearGradient id="ptcGrill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="thermalNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <circle cx="300" cy="300" r="260" fill="url(#heatGlow)"/>
  <ellipse cx="300" cy="520" rx="170" ry="18" fill="#000" opacity="0.6"/>

  <!-- Warm Air Vortex Waves Radiating Outward -->
  <path d="M 380 200 Q 480 240 520 280" stroke="#f97316" stroke-width="4" fill="none" opacity="0.6" filter="url(#thermalNeon)"/>
  <path d="M 380 280 Q 500 310 530 360" stroke="#ef4444" stroke-width="5" fill="none" opacity="0.7" filter="url(#thermalNeon)"/>
  <path d="M 380 360 Q 480 390 510 440" stroke="#eab308" stroke-width="4" fill="none" opacity="0.6" filter="url(#thermalNeon)"/>

  <g transform="translate(0, -10)">
    <!-- Tower Heater Base Stand -->
    <ellipse cx="280" cy="480" rx="110" ry="24" fill="#0f1322" stroke="#334155" stroke-width="2"/>
    <ellipse cx="280" cy="475" rx="95" ry="18" fill="#1e293b"/>

    <!-- Main Cylindrical PTC Tower Body -->
    <rect x="210" y="120" width="140" height="350" rx="20" fill="url(#towerBody)" stroke="#384366" stroke-width="2.5"/>

    <!-- Glowing PTC Ceramic Honeycomb Heating Core -->
    <rect x="230" y="190" width="100" height="210" rx="12" fill="#0b0e18" stroke="#f97316" stroke-width="2" filter="url(#thermalNeon)"/>

    <!-- Glowing Ceramic Elements (Horizontal Heat Bars) -->
    <g stroke="url(#ptcGrill)" stroke-width="4" stroke-linecap="round" filter="url(#thermalNeon)">
      <line x1="245" y1="210" x2="315" y2="210"/>
      <line x1="245" y1="230" x2="315" y2="230"/>
      <line x1="245" y1="250" x2="315" y2="250"/>
      <line x1="245" y1="270" x2="315" y2="270"/>
      <line x1="245" y1="290" x2="315" y2="290"/>
      <line x1="245" y1="310" x2="315" y2="310"/>
      <line x1="245" y1="330" x2="315" y2="330"/>
      <line x1="245" y1="350" x2="315" y2="350"/>
      <line x1="245" y1="370" x2="315" y2="370"/>
    </g>

    <!-- Top Touch Panel with Digital Thermostat LED -->
    <circle cx="280" cy="155" r="24" fill="#080b14" stroke="#f97316" stroke-width="1.5"/>
    <text x="280" y="162" fill="#f97316" font-size="16" font-weight="bold" font-family="'Outfit', sans-serif" text-anchor="middle" filter="url(#thermalNeon)">28°</text>
    <text x="280" y="172" fill="#eab308" font-size="7" font-weight="bold" text-anchor="middle">HEAT ON</text>

    <!-- Base Ambient Amber Nightlight -->
    <ellipse cx="280" cy="460" rx="60" ry="8" fill="#f97316" opacity="0.8" filter="url(#thermalNeon)"/>
  </g>
</svg>
