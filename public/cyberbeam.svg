<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="projGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0b10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="projBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2438"/>
      <stop offset="60%" stop-color="#111422"/>
      <stop offset="100%" stop-color="#090b14"/>
    </linearGradient>
    <linearGradient id="fabricGrill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="50%" stop-color="#1a202c"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
    <linearGradient id="laserBeam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="300" cy="300" r="260" fill="url(#projGlow)"/>

  <!-- Laser Projection Beam Emanating Upward -->
  <polygon points="300,310 80,40 520,40" fill="url(#laserBeam)" filter="url(#laserGlow)"/>

  <!-- Projector Drop Shadow -->
  <ellipse cx="300" cy="500" rx="230" ry="24" fill="#000" opacity="0.6"/>

  <!-- Projector Base Hardware Chassis -->
  <g transform="translate(0, 50)">
    <!-- Main Enclosure Body -->
    <rect x="100" y="270" width="400" height="150" rx="20" fill="url(#projBody)" stroke="#384366" stroke-width="2.5"/>

    <!-- Acoustic Fabric Front / Speaker Soundbar Grill -->
    <rect x="110" y="340" width="380" height="70" rx="10" fill="url(#fabricGrill)" stroke="#222b40" stroke-width="1.5"/>
    
    <!-- Fine Grill Texture Lines -->
    <g stroke="#3a4768" stroke-width="1" opacity="0.4">
      <line x1="120" y1="355" x2="480" y2="355"/>
      <line x1="120" y1="370" x2="480" y2="370"/>
      <line x1="120" y1="385" x2="480" y2="385"/>
      <line x1="120" y1="400" x2="480" y2="400"/>
    </g>

    <!-- Top Recessed UST Laser Optical Cavity -->
    <path d="M 180 270 L 220 310 L 380 310 L 420 270 Z" fill="#0b0e18" stroke="#252d45" stroke-width="2"/>
    
    <!-- Laser Lens Optics -->
    <ellipse cx="300" cy="310" rx="55" ry="18" fill="#060913" stroke="#06b6d4" stroke-width="2" filter="url(#laserGlow)"/>
    <ellipse cx="300" cy="310" rx="40" ry="12" fill="#06b6d4" opacity="0.8" filter="url(#laserGlow)"/>
    <ellipse cx="300" cy="310" rx="20" ry="6" fill="#ffffff"/>

    <!-- Front Logo & Status Display -->
    <text x="300" y="325" fill="#a855f7" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle" letter-spacing="2">4K ULTRA SHORT THROW // DOLBY ATMOS</text>

    <!-- Touch Control Icons on Top Surface -->
    <circle cx="150" cy="290" r="8" fill="#151b2a" stroke="#2c3652" stroke-width="1.5"/>
    <circle cx="150" cy="290" r="3" fill="#06b6d4"/>

    <circle cx="175" cy="290" r="8" fill="#151b2a" stroke="#2c3652" stroke-width="1.5"/>
    <circle cx="175" cy="290" r="3" fill="#a855f7"/>

    <circle cx="450" cy="290" r="8" fill="#151b2a" stroke="#2c3652" stroke-width="1.5"/>
    <circle cx="450" cy="290" r="3" fill="#10b981"/>

    <!-- Ambient Base Underglow LED Strip -->
    <line x1="140" y1="422" x2="460" y2="422" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" filter="url(#laserGlow)"/>
  </g>
</svg>
