<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="tvGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0b10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tvPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1a"/>
      <stop offset="100%" stop-color="#020307"/>
    </linearGradient>
    <linearGradient id="screenMovie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="30%" stop-color="#312e81"/>
      <stop offset="70%" stop-color="#701a75"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="tvNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <circle cx="300" cy="300" r="260" fill="url(#tvGlow)"/>
  <ellipse cx="300" cy="510" rx="220" ry="18" fill="#000" opacity="0.6"/>

  <g transform="translate(0, 30)">
    <!-- TV Ambient Backlight Ambilight Glow -->
    <rect x="50" y="80" width="500" height="290" rx="8" fill="#a855f7" opacity="0.25" filter="url(#tvNeon)"/>

    <!-- Ultra-Thin OLED Bezel / Frame -->
    <rect x="60" y="90" width="480" height="270" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>

    <!-- 8K OLED Display Panel -->
    <rect x="64" y="94" width="472" height="262" rx="4" fill="url(#screenMovie)"/>

    <!-- Cinematic Landscape HDR Display Visual -->
    <g opacity="0.95">
      <!-- Neon Sun & Mountains on Screen -->
      <circle cx="240" cy="180" r="50" fill="#f43f5e" filter="url(#tvNeon)" opacity="0.8"/>
      <path d="M 64 290 L 180 200 L 290 280 L 380 180 L 536 290 L 536 356 L 64 356 Z" fill="#080c18"/>
      <path d="M 120 310 L 260 230 L 400 320 L 536 250 L 536 356 L 64 356 Z" fill="#131b2e" opacity="0.6"/>
      
      <!-- Water Reflection Lines -->
      <line x1="120" y1="315" x2="480" y2="315" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
      <line x1="160" y1="330" x2="440" y2="330" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>

      <!-- Overlay Badges -->
      <rect x="80" y="110" width="65" height="22" rx="4" fill="#000000" opacity="0.7"/>
      <text x="112" y="125" fill="#38bdf8" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">8K HDR</text>

      <rect x="155" y="110" width="90" height="22" rx="4" fill="#000000" opacity="0.7"/>
      <text x="200" y="125" fill="#f43f5e" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">DOLBY VISION</text>
    </g>

    <!-- Glass Glare Reflection -->
    <polygon points="64,94 220,94 110,356 64,356" fill="#ffffff" opacity="0.04"/>

    <!-- Premium Sculpted Aluminum Center Stand -->
    <polygon points="280,360 320,360 335,430 265,430" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="210" y="430" width="180" height="12" rx="6" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <!-- LED Stand Accent -->
    <line x1="230" y1="436" x2="370" y2="436" stroke="#06b6d4" stroke-width="2" filter="url(#tvNeon)"/>
  </g>
</svg>
