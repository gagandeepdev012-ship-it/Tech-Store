<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="hsGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0b10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headbandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="earcupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2438"/>
      <stop offset="50%" stop-color="#0f1322"/>
      <stop offset="100%" stop-color="#080a14"/>
    </linearGradient>
    <filter id="headsetNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <circle cx="300" cy="300" r="260" fill="url(#hsGlow)"/>
  <ellipse cx="300" cy="500" rx="180" ry="18" fill="#000" opacity="0.6"/>

  <g transform="translate(0, 10)">
    <!-- Headband Arc (Top Outer Band) -->
    <path d="M 160 300 C 140 120, 460 120, 440 300" fill="none" stroke="url(#headbandGrad)" stroke-width="24" stroke-linecap="round"/>

    <!-- Inner Cushion Pad on Headband -->
    <path d="M 200 230 C 230 170, 370 170, 400 230" fill="none" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
    
    <!-- ARGB Lighting Strip along Headband -->
    <path d="M 220 200 C 250 175, 350 175, 380 200" fill="none" stroke="#06b6d4" stroke-width="3" filter="url(#headsetNeon)"/>

    <!-- Left Ear Cup Assembly -->
    <g transform="translate(110, 240)">
      <!-- Ear Cushion Foam -->
      <ellipse cx="45" cy="80" rx="35" ry="65" fill="#0c101d" stroke="#334155" stroke-width="3"/>
      <!-- Outer Ear Cup Shell -->
      <ellipse cx="45" cy="80" rx="28" ry="55" fill="url(#earcupGrad)" stroke="#475569" stroke-width="2"/>
      <!-- RGB Vortex Ring on Earcup -->
      <ellipse cx="45" cy="80" rx="20" ry="40" fill="none" stroke="#a855f7" stroke-width="3" filter="url(#headsetNeon)"/>
      <ellipse cx="45" cy="80" rx="10" ry="20" fill="#06b6d4" filter="url(#headsetNeon)" opacity="0.8"/>
      
      <!-- Detachable Boom Microphone -->
      <path d="M 45 130 Q 80 190 140 180" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
      <!-- Mic Capsule with LED Status Ring -->
      <rect x="140" y="170" width="24" height="16" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
      <circle cx="160" cy="178" r="3" fill="#10b981" filter="url(#headsetNeon)"/>
    </g>

    <!-- Right Ear Cup Assembly -->
    <g transform="translate(410, 240)">
      <ellipse cx="45" cy="80" rx="35" ry="65" fill="#0c101d" stroke="#334155" stroke-width="3"/>
      <ellipse cx="45" cy="80" rx="28" ry="55" fill="url(#earcupGrad)" stroke="#475569" stroke-width="2"/>
      <ellipse cx="45" cy="80" rx="20" ry="40" fill="none" stroke="#a855f7" stroke-width="3" filter="url(#headsetNeon)"/>
      <ellipse cx="45" cy="80" rx="10" ry="20" fill="#06b6d4" filter="url(#headsetNeon)" opacity="0.8"/>
    </g>

    <!-- Metal Height Adjustment Forks -->
    <rect x="142" y="240" width="16" height="40" rx="4" fill="#64748b" stroke="#334155" stroke-width="1"/>
    <rect x="442" y="240" width="16" height="40" rx="4" fill="#64748b" stroke="#334155" stroke-width="1"/>
  </g>
</svg>
