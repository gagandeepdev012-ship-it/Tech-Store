<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="airGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0b10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodySilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screenWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="neonG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="screenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <circle cx="300" cy="300" r="260" fill="url(#airGlow)"/>
  <ellipse cx="300" cy="480" rx="230" ry="20" fill="#000" opacity="0.6"/>

  <g transform="translate(0, 10)">
    <!-- Laptop Open Screen Lid -->
    <path d="M 120 140 L 480 140 L 450 360 L 150 360 Z" fill="url(#bodySilver)" stroke="#475569" stroke-width="2"/>
    
    <!-- Screen Display Area -->
    <path d="M 132 150 L 468 150 L 442 350 L 158 350 Z" fill="url(#screenWall)"/>
    
    <!-- Wallpaper Art on Screen -->
    <g opacity="0.9">
      <ellipse cx="300" cy="250" rx="110" ry="60" fill="url(#neonG)" filter="url(#screenGlow)" opacity="0.8"/>
      <circle cx="300" cy="235" r="30" fill="#ffffff" opacity="0.7"/>
      <line x1="160" y1="330" x2="440" y2="330" stroke="#06b6d4" stroke-width="1.5" opacity="0.6"/>
      <text x="300" y="190" fill="#38bdf8" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle" letter-spacing="2">NEXUS AIRBOOK // 1.1 KG</text>
    </g>

    <!-- Screen Bezel Camera -->
    <circle cx="300" cy="145" r="2.5" fill="#06b6d4"/>

    <!-- Bottom Keyboard Base / Deck -->
    <path d="M 150 360 L 450 360 L 530 460 L 70 460 Z" fill="url(#bodySilver)" stroke="#475569" stroke-width="2.5"/>

    <!-- Backlit Keyboard Island -->
    <path d="M 165 372 L 435 372 L 475 425 L 125 425 Z" fill="#0d111c" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Keyboard Keys Grid Impression -->
    <g stroke="#06b6d4" stroke-width="1" opacity="0.5">
      <line x1="155" y1="385" x2="445" y2="385"/>
      <line x1="145" y1="398" x2="455" y2="398"/>
      <line x1="135" y1="412" x2="465" y2="412"/>
    </g>

    <!-- Force Touch Trackpad -->
    <polygon points="255,432 345,432 355,454 245,454" fill="#141a29" stroke="#334155" stroke-width="1.5"/>

    <!-- Edge Highlighting -->
    <path d="M 70 460 L 530 460" stroke="#38bdf8" stroke-width="2" opacity="0.8" filter="url(#screenGlow)"/>
  </g>
</svg>
