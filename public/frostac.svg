<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="acGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0b10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="acBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="coolBreeze" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/>
    </linearGradient>
    <filter id="frostNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <circle cx="300" cy="300" r="260" fill="url(#acGlow)"/>
  
  <!-- Cool Airflow Waves Blowing Downward -->
  <path d="M 120 280 Q 150 440 180 500" stroke="url(#coolBreeze)" stroke-width="4" fill="none" opacity="0.8" filter="url(#frostNeon)"/>
  <path d="M 220 280 Q 240 460 260 520" stroke="url(#coolBreeze)" stroke-width="6" fill="none" opacity="0.85" filter="url(#frostNeon)"/>
  <path d="M 300 280 Q 300 470 300 530" stroke="url(#coolBreeze)" stroke-width="7" fill="none" opacity="0.9" filter="url(#frostNeon)"/>
  <path d="M 380 280 Q 360 460 340 520" stroke="url(#coolBreeze)" stroke-width="6" fill="none" opacity="0.85" filter="url(#frostNeon)"/>
  <path d="M 480 280 Q 450 440 420 500" stroke="url(#coolBreeze)" stroke-width="4" fill="none" opacity="0.8" filter="url(#frostNeon)"/>

  <!-- Airflow Particles / Frost Crystals -->
  <g fill="#38bdf8" opacity="0.8" filter="url(#frostNeon)">
    <circle cx="210" cy="400" r="4"/>
    <circle cx="280" cy="450" r="5"/>
    <circle cx="330" cy="420" r="4"/>
    <circle cx="390" cy="470" r="3"/>
  </g>

  <!-- AC Indoor Unit -->
  <g transform="translate(0, 30)">
    <!-- Shadow behind unit -->
    <rect x="70" y="150" width="460" height="150" rx="20" fill="#000" opacity="0.4"/>

    <!-- Main Sleek White Indoor Chassis -->
    <rect x="80" y="140" width="440" height="140" rx="16" fill="url(#acBody)" stroke="#94a3b8" stroke-width="2"/>

    <!-- Top Air Intake Grille Lines -->
    <g stroke="#94a3b8" stroke-width="1.5" opacity="0.6">
      <line x1="120" y1="152" x2="480" y2="152"/>
      <line x1="120" y1="160" x2="480" y2="160"/>
    </g>

    <!-- Hidden Mirror Smart Digital Temperature LED -->
    <g transform="translate(420, 185)">
      <circle cx="24" cy="20" r="24" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="24" y="27" fill="#38bdf8" font-size="20" font-weight="bold" font-family="'Outfit', sans-serif" text-anchor="middle" filter="url(#frostNeon)">18°</text>
      <text x="24" y="38" fill="#10b981" font-size="7" font-weight="bold" text-anchor="middle">AI ECO</text>
    </g>

    <!-- Brand Emblem & 5-Star Energy Badge -->
    <text x="120" y="210" fill="#334155" font-size="14" font-weight="bold" font-family="'Outfit', sans-serif" letter-spacing="2">NEXUS FROST</text>
    <text x="120" y="226" fill="#0284c7" font-size="9" font-weight="bold">DUAL INVERTER • 5 STAR</text>

    <!-- Motorized Bottom Louver / Air Flap in Open Position -->
    <path d="M 95 260 L 505 260 L 495 278 L 105 278 Z" fill="#0284c7" opacity="0.9" filter="url(#frostNeon)"/>
    <line x1="95" y1="260" x2="505" y2="260" stroke="#38bdf8" stroke-width="2"/>

    <!-- Front Glossy Highlight -->
    <path d="M 80 140 L 300 140 L 220 270 L 80 270 Z" fill="#ffffff" opacity="0.15"/>
  </g>
</svg>
