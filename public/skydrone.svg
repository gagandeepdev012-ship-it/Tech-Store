<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="droneGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0b10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyCarbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3048"/>
      <stop offset="50%" stop-color="#151928"/>
      <stop offset="100%" stop-color="#0b0d18"/>
    </linearGradient>
    <linearGradient id="armGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#343c5a"/>
      <stop offset="100%" stop-color="#121624"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="300" cy="300" r="260" fill="url(#droneGlow)"/>

  <!-- Shadow below drone -->
  <ellipse cx="300" cy="500" rx="190" ry="20" fill="#000" opacity="0.6"/>

  <g transform="translate(0, -10)">
    <!-- Rotor Blade Motion Blur Rings -->
    <!-- Top-Left Rotor Ring -->
    <ellipse cx="140" cy="180" rx="90" ry="30" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="10 15 30 15" opacity="0.7" filter="url(#cyanGlow)"/>
    <ellipse cx="140" cy="180" rx="60" ry="20" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
    <!-- Rotor Hub -->
    <circle cx="140" cy="180" r="14" fill="#1e2438" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="140" cy="180" r="5" fill="#06b6d4" filter="url(#cyanGlow)"/>

    <!-- Top-Right Rotor Ring -->
    <ellipse cx="460" cy="180" rx="90" ry="30" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="10 15 30 15" opacity="0.7" filter="url(#cyanGlow)"/>
    <ellipse cx="460" cy="180" rx="60" ry="20" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
    <!-- Rotor Hub -->
    <circle cx="460" cy="180" r="14" fill="#1e2438" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="460" cy="180" r="5" fill="#06b6d4" filter="url(#cyanGlow)"/>

    <!-- Bottom-Left Rotor Ring -->
    <ellipse cx="110" cy="360" rx="95" ry="32" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="15 20 25 10" opacity="0.6" filter="url(#cyanGlow)"/>
    <circle cx="110" cy="360" r="14" fill="#1e2438" stroke="#a855f7" stroke-width="2"/>
    <circle cx="110" cy="360" r="5" fill="#a855f7"/>

    <!-- Bottom-Right Rotor Ring -->
    <ellipse cx="490" cy="360" rx="95" ry="32" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="15 20 25 10" opacity="0.6" filter="url(#cyanGlow)"/>
    <circle cx="490" cy="360" r="14" fill="#1e2438" stroke="#a855f7" stroke-width="2"/>
    <circle cx="490" cy="360" r="5" fill="#a855f7"/>

    <!-- Carbon Fiber Rotor Arms -->
    <!-- Front Left Arm -->
    <polygon points="260,260 240,275 140,185 145,175" fill="url(#armGrad)" stroke="#3e486d" stroke-width="1.5"/>
    <!-- Front Right Arm -->
    <polygon points="340,260 360,275 460,185 455,175" fill="url(#armGrad)" stroke="#3e486d" stroke-width="1.5"/>
    <!-- Rear Left Arm -->
    <polygon points="255,310 235,325 110,365 115,355" fill="url(#armGrad)" stroke="#3e486d" stroke-width="1.5"/>
    <!-- Rear Right Arm -->
    <polygon points="345,310 365,325 490,365 485,355" fill="url(#armGrad)" stroke="#3e486d" stroke-width="1.5"/>

    <!-- Aerodynamic Center Drone Fuselage -->
    <path d="M 300 200 
             C 340 200, 365 240, 360 310 
             C 355 370, 340 400, 300 410 
             C 260 400, 245 370, 240 310 
             C 235 240, 260 200, 300 200 Z" 
          fill="url(#bodyCarbon)" stroke="#4a557d" stroke-width="2.5"/>

    <!-- Upper Aerodynamic Vents / Canopy -->
    <path d="M 300 220 C 320 220, 335 245, 330 285 C 325 320, 315 340, 300 345 C 285 340, 275 320, 270 285 C 265 245, 280 220, 300 220 Z" 
          fill="#0c0e17" stroke="#06b6d4" stroke-width="1.5" opacity="0.9"/>

    <!-- Power & LiDAR Status LED Bar -->
    <rect x="294" y="235" width="12" height="60" rx="6" fill="#06b6d4" opacity="0.8" filter="url(#cyanGlow)"/>
    <circle cx="300" cy="245" r="3" fill="#fff"/>
    <circle cx="300" cy="265" r="3" fill="#fff"/>
    <circle cx="300" cy="285" r="3" fill="#fff"/>

    <!-- 3-Axis Gimbal 8K Camera Unit -->
    <!-- Gimbal Fork -->
    <rect x="288" y="385" width="24" height="20" rx="4" fill="#1a1f30" stroke="#333d5a" stroke-width="1.5"/>
    <circle cx="300" cy="420" r="34" fill="#101320" stroke="#06b6d4" stroke-width="2.5"/>
    
    <!-- Camera Lens Barrel -->
    <circle cx="300" cy="420" r="26" fill="#070911" stroke="#384366" stroke-width="2"/>
    <!-- Optical Lens Coating -->
    <circle cx="300" cy="420" r="18" fill="url(#lensGrad)"/>
    <circle cx="300" cy="420" r="8" fill="#05070d"/>
    
    <!-- Lens Flare Reflex -->
    <circle cx="294" cy="414" r="4" fill="#ffffff" opacity="0.7"/>
    <circle cx="304" cy="426" r="2" fill="#ffffff" opacity="0.4"/>

    <!-- Landing Gear Struts -->
    <path d="M 255 350 L 230 440 L 250 440" fill="none" stroke="#2a324d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 345 350 L 370 440 L 350 440" fill="none" stroke="#2a324d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Obstacle Avoidance Sensors -->
    <circle cx="270" cy="215" r="4" fill="#ef4444" filter="url(#cyanGlow)"/>
    <circle cx="330" cy="215" r="4" fill="#ef4444" filter="url(#cyanGlow)"/>
  </g>
</svg>
